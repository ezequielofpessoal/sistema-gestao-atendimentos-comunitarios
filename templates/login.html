{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4">
            <h1 class="h3 text-center mb-3">Acesso ao Sistema</h1>
            <p class="text-muted text-center small mb-4">Sessão protegida para voluntários autorizados.</p>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-bold">E-mail ou Usuário *</label>
                    <input type="email" class="form-control form-control-lg" id="usuario" name="usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label fw-bold">Senha de Acesso *</label>
                    <input type="password" class="form-control form-control-lg" id="senha" name="senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 min-target">ENTRAR NO SISTEMA</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
